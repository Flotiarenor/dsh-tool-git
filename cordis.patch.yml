# dsh-tool-git bundle patch：把 tool-git 行插进 profile 的宿主组合，从而对**所有**会话可见
# （不限于某一个 preset）。
#
#   dsh plugin --profile desktop add link:<本仓库的绝对路径>
#   # 然后重启 dsh
#
# 为什么可以走宿主平面：本插件注册的是 `git` / `git_commit` 两个**不与原生工具重名**的工具，
# 不存在同名注册冲突；它消费宿主服务（tools / systemPrompt，subprocess 为可选），不发布任何服务，
# 实现是纯 Node（进程内、零依赖），因此宿主平面插入没有额外依赖。
#
# 与 preset 安装方式的区别：
#   * 这里（宿主层）= 每个会话都有这两个工具与那段提示词，任何 preset 都能用；
#   * preset 层安装 = 只有选了这个 preset 的会话有，其它项目/会话的工具表保持干净。
# 注意：`ctx.tools.guard` 的 shell git 拦截是**进程级**的，它随本插件的加载范围生效，
# 也就是说 preset 层安装只拦选了该 preset 的会话。要全局拦截请用这里（宿主层）。
#
# 卸载：`dsh plugin --profile desktop remove @flotiarenor/dsh-tool-git`，再重启 dsh。
- insert:
    - id: tool-git
      name: '@flotiarenor/dsh-tool-git'
